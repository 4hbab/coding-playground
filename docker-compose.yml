# PyPlayground production stack.
#
#   docker compose up -d --build     # start (or update) the app on http://127.0.0.1:8080
#   docker compose down              # stop it and remove the sandbox containers
#
# Settings come from .env.production (copy .env.production.example).
# Visitors reach the app through Cloudflare: cloudflared runs on the host as a system
# service and forwards tunnel traffic to 127.0.0.1:8080 (see docs/DEPLOY.md).
name: pyplayground

services:
  app:
    build: .
    image: pyplayground:latest
    restart: unless-stopped
    env_file: .env.production
    environment:
      DB_PATH: /data/playground.db
    # The sandbox containers are started through the host's Docker daemon, so the
    # app needs its socket. The app user joins the socket's group instead of
    # running as root (gid 0 on Docker Desktop; on Linux, use the docker group:
    # DOCKER_GID=$(stat -c %g /var/run/docker.sock)).
    # WARNING: access to the Docker socket is equivalent to root on the Docker host.
    group_add:
      - "${DOCKER_GID:-0}"
    volumes:
      - app-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      # Bound to localhost only: the host's cloudflared forwards tunnel traffic here,
      # and nothing outside the machine can connect directly.
      - "127.0.0.1:8080:8080"

volumes:
  app-data:
