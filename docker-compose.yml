# PyPlayground production stack: the app plus the Cloudflare Tunnel connector.
#
#   docker compose up -d --build                    # app only, on http://127.0.0.1:8080
#   docker compose --profile tunnel up -d --build   # app + tunnel (public via the Worker)
#
# Settings come from .env.production (copy .env.production.example).
name: pyplayground

services:
  app:
    build: .
    image: pyplayground:latest
    restart: unless-stopped
    env_file: .env.production
    environment:
      DB_PATH: /data/playground.db
    # The sandbox containers are started through the host's Docker daemon, so the
    # app needs its socket. The app user joins the socket's group instead of
    # running as root (gid 0 on Docker Desktop; on Linux, use the docker group:
    # DOCKER_GID=$(stat -c %g /var/run/docker.sock)).
    # WARNING: access to the Docker socket is equivalent to root on the Docker host.
    group_add:
      - "${DOCKER_GID:-0}"
    volumes:
      - app-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      # Local access only. Visitors come in through the tunnel, never this port.
      - "127.0.0.1:8080:8080"

  cloudflared:
    image: cloudflare/cloudflared:2026.9.1@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    env_file: .env.production # reads TUNNEL_TOKEN
    depends_on:
      app:
        condition: service_healthy

volumes:
  app-data:
