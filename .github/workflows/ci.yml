name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs (tag in the trailing comment) so a moved or
# compromised tag can't change what runs here. Versions follow the 7-day upgrade cooldown.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Dependencies come only from go.sum; fail if anything downloaded doesn't match it.
      - name: Verify dependencies
        run: go mod verify

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2 # keep in sync with GOLANGCI_LINT_VERSION in the Makefile

  test:
    name: Test (race detector)
    runs-on: ubuntu-24.04
    env:
      # GitHub-hosted runners ship with Docker, so the sandbox tests must run here.
      # This makes them fail instead of skip if the daemon is ever missing.
      REQUIRE_DOCKER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: go test -race
        run: go test -race -count=1 ./...

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t pyplayground:ci .
